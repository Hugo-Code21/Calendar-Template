<!doctype html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Kalender Indonesia 2026</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Kalender Indonesia 2026</h1>
		<p>Pilih tanggal untuk melihat atau menambahkan acara.</p>
	</header>

    <!-- Main content: calendar and agenda -->
	<main>
		<section class="calendar">
			<div class="month-controls">
				<button id="previous-month" type="button" aria-label="Bulan sebelumnya">&lt;</button>
				<h2 id="month-title"></h2>
				<button id="next-month" type="button" aria-label="Bulan berikutnya">&gt;</button>
			</div>
			<div class="calendar-grid" id="calendar-grid"></div>
		</section>

		<section class="agenda">
			<h2 id="selected-date"></h2>
			<ul id="event-list"></ul>

			<form id="event-form">
				<h3>Tambah acara</h3>
				<label for="event-title">Nama acara</label>
				<input id="event-title" type="text" placeholder="Contoh: Makan bersama" required>

				<label for="event-date">Tanggal</label>
				<input id="event-date" type="date" min="2026-01-01" max="2026-12-31" required>

				<button type="submit">Simpan acara</button>
			</form>
		</section>
	</main>

    <!-- Event form and calendar logic -->
	<script>
		const months = [
			'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
			'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
		];
		const weekdays = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
		const storageKey = 'hari-calendar-events-2026';
		const defaultEvents = [
			{ id: 'new-year', date: '2026-01-01', title: 'Tahun Baru Masehi' },
			{ id: 'imlek', date: '2026-02-17', title: 'Tahun Baru Imlek' },
			{ id: 'kartini', date: '2026-04-21', title: 'Hari Kartini' },
			{ id: 'labor', date: '2026-05-01', title: 'Hari Buruh Internasional' },
			{ id: 'pancasila', date: '2026-06-01', title: 'Hari Lahir Pancasila' },
			{ id: 'independence', date: '2026-08-17', title: 'Hari Kemerdekaan RI' },
			{ id: 'youth', date: '2026-10-28', title: 'Hari Sumpah Pemuda' },
			{ id: 'heroes', date: '2026-11-10', title: 'Hari Pahlawan' },
			{ id: 'christmas', date: '2026-12-25', title: 'Hari Raya Natal' }
		];

		let events = JSON.parse(localStorage.getItem(storageKey)) || defaultEvents;
		const today = new Date();
		let month = today.getFullYear() === 2026 ? today.getMonth() : 0;
		let selectedDate = today.getFullYear() === 2026 ? makeDate(month, today.getDate()) : '2026-01-01';

		function makeDate(monthNumber, day) {
			return `2026-${String(monthNumber + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
		}

		function showCalendar() {
			document.querySelector('#month-title').textContent = `${months[month]} 2026`;
			const grid = document.querySelector('#calendar-grid');
			grid.replaceChildren();

			weekdays.forEach((day) => {
				const label = document.createElement('span');
				label.className = 'weekday';
				label.textContent = day;
				grid.append(label);
			});

			const firstWeekday = new Date(2026, month, 1).getDay();
			const emptyDays = (firstWeekday + 6) % 7;
			const daysInMonth = new Date(2026, month + 1, 0).getDate();

			for (let day = 0; day < emptyDays; day++) {
				grid.append(document.createElement('span'));
			}

			for (let day = 1; day <= daysInMonth; day++) {
				const date = makeDate(month, day);
				const button = document.createElement('button');
				button.type = 'button';
				button.className = 'day';
				button.textContent = day;

				if (date === selectedDate) button.classList.add('selected');
				if (events.some((event) => event.date === date)) button.classList.add('has-event');

				button.addEventListener('click', () => {
					selectedDate = date;
					document.querySelector('#event-date').value = date;
					showCalendar();
					showEvents();
				});

				grid.append(button);
			}
		}

		function showEvents() {
			const dateLabel = new Intl.DateTimeFormat('id-ID', {
				weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
			}).format(new Date(`${selectedDate}T00:00:00`));
			document.querySelector('#selected-date').textContent = dateLabel;

			const list = document.querySelector('#event-list');
			list.replaceChildren();
			const todaysEvents = events.filter((event) => event.date === selectedDate);

			if (todaysEvents.length === 0) {
				const emptyMessage = document.createElement('li');
				emptyMessage.textContent = 'Belum ada acara.';
				list.append(emptyMessage);
				return;
			}

			todaysEvents.forEach((event) => {
				const item = document.createElement('li');
				const title = document.createElement('span');
				title.textContent = event.title;

				const deleteButton = document.createElement('button');
				deleteButton.type = 'button';
				deleteButton.textContent = 'Hapus';
				deleteButton.addEventListener('click', () => {
					events = events.filter((savedEvent) => savedEvent.id !== event.id);
					localStorage.setItem(storageKey, JSON.stringify(events));
					showCalendar();
					showEvents();
				});

				item.append(title, deleteButton);
				list.append(item);
			});
		}

		document.querySelector('#previous-month').addEventListener('click', () => {
			month = (month + 11) % 12;
			selectedDate = makeDate(month, 1);
			document.querySelector('#event-date').value = selectedDate;
			showCalendar();
			showEvents();
		});

		document.querySelector('#next-month').addEventListener('click', () => {
			month = (month + 1) % 12;
			selectedDate = makeDate(month, 1);
			document.querySelector('#event-date').value = selectedDate;
			showCalendar();
			showEvents();
		});

		document.querySelector('#event-form').addEventListener('submit', (event) => {
			event.preventDefault();
			const title = document.querySelector('#event-title').value.trim();
			const date = document.querySelector('#event-date').value;

			if (!title || !date) return;

			events.push({ id: Date.now(), date, title });
			localStorage.setItem(storageKey, JSON.stringify(events));
			selectedDate = date;
			month = Number(date.slice(5, 7)) - 1;
			document.querySelector('#event-form').reset();
			document.querySelector('#event-date').value = selectedDate;
			showCalendar();
			showEvents();
		});

		document.querySelector('#event-date').value = selectedDate;
		showCalendar();
		showEvents();
	</script>
</body>
</html>
